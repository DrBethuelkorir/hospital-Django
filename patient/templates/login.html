{% extends 'base.html' %}

{% load static %}
{% block title %}Login - MediCare{% endblock %}

{% block content %}
<style>
    /* Center the login card on the screen */
    .login-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f4f6f9;
    }
    
    .login-card {
        width: 100%;
        max-width: 420px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        background: white;
        padding: 40px 30px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header i {
        font-size: 45px;
        color: #172b4d; /* Sidebar blue color */
        margin-bottom: 10px;
    }

    .login-header h3 {
        font-weight: bold;
        color: #172b4d;
    }
</style>

<div class="login-wrapper">
    <div class="card login-card">
        
        <div class="login-header">
            <i class="bi bi-heart-pulse-fill"></i>
            <h3>Welcome Back</h3>
            <p class="text-muted">Log in to your MediCare account</p>
        </div>

        <!-- Show error message if login fails -->
        {% if message %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label text-muted">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-muted">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </div>
            
        </form>
        
        <div class="text-center mt-4">
            <small class="text-muted">Don't have an account? <a href="{% url 'index' %}" class="text-decoration-none">Sign up here</a></small>
        </div>

    </div>
</div>
{% endblock %}
